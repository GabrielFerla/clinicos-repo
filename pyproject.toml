[project]
name = "clinicos"
version = "0.1.0"
description = "ClinicOS — sistema de gestão para clínicas oftalmológicas (MVP1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Grupo MedReview" },
]
dependencies = [
    "django>=5.1,<6.0",
    "oracledb>=2.5",
    "django-environ>=0.11",
]

[project.optional-dependencies]
dev = [
    # Teto de versão em black/ruff é intencional — ver comentário em
    # infra/django/requirements/dev.txt.
    "black>=26.0,<27.0",
    "ruff>=0.16,<0.17",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | \.claude
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
# ``.claude/worktrees/`` guarda checkouts inteiros do repo criados por agentes.
# Sem excluí-lo, ``make fmt`` reformata centenas de arquivos de outras branches.
extend-exclude = ["migrations", ".venv", ".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "DJ",  # flake8-django
]
ignore = [
    "S101",  # uso de assert é ok em testes
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501"]
"config/settings/_placeholder.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"

# Markers precisam ser registrados aqui por causa do ``--strict-markers``:
# sem esta seção, usar ``@pytest.mark.oracle`` não vira skip — vira **erro de
# coleta**, e a suíte inteira deixa de rodar.
#
# Note que NÃO há ``-m`` no ``addopts``. Quem filtra é o CI (via ``ci.yml``) e
# os alvos do Makefile. Embutir o filtro aqui faria os testes de Oracle nunca
# rodarem por acidente, que é o pior dos mundos. O auto-skip fica no
# ``conftest.py`` da raiz, controlado por variável de ambiente.
markers = [
    "oracle: exige Oracle 23ai real (coluna VECTOR, PL/SQL, constraints). Habilite com CLINICOS_TEST_ORACLE=1.",
    "llm: exige Ollama no host (chat ou embeddings). Habilite com CLINICOS_TEST_LLM=1.",
]
