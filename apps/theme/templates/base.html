{% load static tailwind_tags %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClinicOS{% endblock %}</title>
  {% tailwind_css %}

</head>
<body class="bg-gray-50 text-gray-900 antialiased">

</body>
</html>
