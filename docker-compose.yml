services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: clinicos-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: oracle
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/oracle@//localhost:1521/FREEPDB1", "AS", "SYSDBA"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinicos-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: clinicos-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  oracle-data:
